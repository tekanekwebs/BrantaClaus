<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <title>The Branti-establishment</title>
        <meta name="description" content="Branta Claus says no. You say yes to someone in need. Welcome to the Branti-establishment." />
        <meta name="theme-color" content="#030906" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,600&family=Mountains+of+Christmas:wght@700&display=swap"
            rel="stylesheet"
        />
        <link rel="prefetch" href="site.html" />
        <script src="js/config.js" defer></script>
        <script src="js/hero.js" defer></script>
        <style>
            /* Branta Claus entrance: hero only. The rest of the site lives in site.html. */

            /* ===== base / reset ===== */
            :root {
                color-scheme: dark;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            html {
                scroll-padding-top: env(safe-area-inset-top, 0px);
            }
            body {
                margin: 0;
                padding: 0;
                font:
                    14px -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                background: #091510;
                color: #fff6e5;
            }
            img {
                max-width: 100%;
            }
            [hidden]:not([hidden="until-found" i]) {
                display: none !important;
            }

            /* ===== design tokens, hero, entrance ===== */
            :root {
                --bg: #091510;
                --ink: #fff6e5;
                --muted: rgba(255, 246, 229, 0.7);
                --red: #c42f29;
                --red-hot: #f25c4f;
                --gold: #f2c14e;
                --line: rgba(255, 246, 229, 0.16);
                --display: "Fraunces", Georgia, serif;
                --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
                --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
                --bar: 0px; /* no top header */
                color-scheme: dark;
            }
            html {
                scroll-behavior: smooth;
                scroll-padding-top: 8px;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font-family: var(--body);
                font-size: 16px;
                line-height: 1.5;
                -webkit-font-smoothing: antialiased;
            }
            body::before {
                content: "";
                position: fixed;
                inset: 0 0 auto;
                height: env(safe-area-inset-top, 0px);
                z-index: 60;
                background: var(--ink);
            }
            a {
                color: inherit;
            }
            :focus-visible {
                outline: 3px solid var(--gold);
                outline-offset: 4px;
            }

            /* ---------- hero ---------- */
            .hero {
                --s: min(calc(100vw / 1280), calc((100svh - var(--bar) - 48px) / 640), 1.2px);
                max-width: none;
            }
            .stage {
                position: relative;
                overflow: hidden;
                display: flex;
                align-items: center;
                box-sizing: border-box;
                min-height: max(calc(100svh - var(--bar)), 560px);
                padding: 24px clamp(40px, 9vw, 220px);
                background-color: var(--bg);
                background-image: radial-gradient(ellipse 55% 75% at 76% 62%, rgba(242, 193, 78, 0.17), rgba(242, 193, 78, 0) 70%),
                    radial-gradient(ellipse 45% 55% at 8% 96%, rgba(196, 47, 41, 0.16), rgba(196, 47, 41, 0) 70%);
            }
            .photo {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                max-width: none;
                object-fit: cover;
                object-position: 72% 30%;
                z-index: 0;
                animation: bgfade 1.4s var(--ease) both;
            }
            .stage::after {
                content: "";
                position: absolute;
                inset: 0;
                z-index: 1;
                pointer-events: none;
                background: linear-gradient(90deg, rgba(9, 21, 16, 0.9) 0%, rgba(9, 21, 16, 0.55) 38%, rgba(9, 21, 16, 0) 68%),
                    linear-gradient(0deg, rgba(9, 21, 16, 0.5) 0%, rgba(9, 21, 16, 0) 35%);
            }
            .snow {
                position: absolute;
                left: 0;
                top: 0;
                width: 55%;
                height: 100%;
                z-index: 1;
                pointer-events: none;
                background-image: radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.45) 0 2px, transparent 3px),
                    radial-gradient(circle at 31% 9%, rgba(255, 255, 255, 0.35) 0 1.5px, transparent 2.5px),
                    radial-gradient(circle at 46% 31%, rgba(255, 255, 255, 0.3) 0 2px, transparent 3px),
                    radial-gradient(circle at 6% 47%, rgba(255, 255, 255, 0.3) 0 1.5px, transparent 2.5px),
                    radial-gradient(circle at 24% 62%, rgba(255, 255, 255, 0.38) 0 2px, transparent 3px),
                    radial-gradient(circle at 39% 78%, rgba(255, 255, 255, 0.28) 0 1.5px, transparent 2.5px),
                    radial-gradient(circle at 15% 88%, rgba(255, 255, 255, 0.4) 0 2px, transparent 3px);
            }
            .content {
                font-family: var(--display);
                font-style: italic;
                position: relative;
                z-index: 3;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: calc(var(--s) * 20);
                text-shadow: 0 2px 16px rgba(9, 21, 16, 0.7);
            }
            .copy {
                display: flex;
                flex-direction: column;
                gap: calc(var(--s) * 18);
            }
            .santa,
            .branta {
                margin: 0;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .santa {
                animation: rise 0.9s var(--ease) 0.1s both;
            }
            .label {
                font-size: clamp(11px, calc(var(--s) * 14), 15px);
                font-weight: 700;
                letter-spacing: 0.16em;
                text-transform: uppercase;
            }
            .santa .label {
                color: var(--muted);
            }
            .branta .label {
                color: var(--gold);
                animation: rise 0.9s var(--ease) 0.3s both;
            }
            .ho {
                font-family: var(--display);
                font-style: italic;
                font-weight: 600;
                font-size: max(26px, calc(var(--s) * 46));
                line-height: 1.1;
                color: rgba(255, 246, 229, 0.7);
                text-decoration: line-through;
                text-decoration-color: var(--red-hot);
                text-decoration-thickness: 3px;
            }
            .no {
                display: block;
                font-family: var(--display);
                font-weight: 900;
                line-height: 0.92;
                color: var(--ink);
            }
            .n1 {
                font-size: max(36px, calc(var(--s) * 60));
                animation: rise 0.9s var(--ease) 0.4s both;
            }
            .n2 {
                font-size: max(52px, calc(var(--s) * 88));
                animation: rise 0.9s var(--ease) 0.52s both;
            }
            .n3 {
                font-size: max(70px, calc(var(--s) * 118));
                color: var(--red-hot);
                transform: rotate(-4deg);
                transform-origin: left bottom;
                animation: rise 1s cubic-bezier(0.2, 0.9, 0.3, 1.15) 0.66s both;
            }

            /* pointing Santa sits right on top of the button */
            .unit {
                --pw: clamp(116px, calc(var(--s) * 150), 190px);
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                text-shadow: none;
            }
            .pointer {
                position: relative;
                z-index: 1;
                width: var(--pw);
                aspect-ratio: 800 / 984;
                overflow: hidden;
                -webkit-mask-image: linear-gradient(to bottom, #000 92%, transparent 100%);
                mask-image: linear-gradient(to bottom, #000 92%, transparent 100%);
                animation: rise 0.9s var(--ease) 0.85s both, float 6s ease-in-out 1.8s infinite;
            }
            .pointer img {
                display: block;
                width: 100%;
                height: auto;
            }
            .bubble {
                position: absolute;
                z-index: 3;
                left: calc(50% + var(--pw) * 0.3);
                top: calc(var(--pw) * 0.22);
                padding: 9px 16px;
                border-radius: 999px;
                background: var(--ink);
                color: var(--bg);
                font-family: var(--display);
                font-weight: 900;
                font-size: 17px;
                line-height: 1;
                white-space: nowrap;
                transform-origin: left center;
                animation: pop 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.25) 1.3s both;
            }
            .bubble::after {
                content: "";
                position: absolute;
                left: -8px;
                top: calc(50% - 7px);
                width: 11px;
                height: 14px;
                background: var(--ink);
                clip-path: polygon(100% 0, 0 50%, 100% 100%);
            }

            /* tablet: text left, photo card right */
            @media (min-width: 700px) and (max-width: 1099px) {
                .hero {
                    --s: min(calc(100vw / 760), 1.2px);
                }
                .unit {
                    --pw: clamp(150px, calc(var(--s) * 170), 210px);
                }
                .stage {
                    display: grid;
                    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                    grid-template-rows: 1fr;
                    gap: clamp(24px, 4vw, 44px);
                    padding: clamp(24px, 4vw, 44px);
                    min-height: max(calc(100svh - var(--bar)), 600px);
                }
                .stage::after,
                .snow {
                    display: none;
                }
                .content {
                    grid-column: 1;
                    grid-row: 1;
                    align-self: center;
                    text-shadow: none;
                }
                .photo {
                    position: relative;
                    inset: auto;
                    grid-column: 2;
                    grid-row: 1;
                    align-self: center;
                    width: 100%;
                    height: auto;
                    aspect-ratio: 5 / 6;
                    max-height: calc(100svh - var(--bar) - 80px);
                    border-radius: 20px;
                    object-position: 66% 30%;
                    box-shadow: 0 0 0 1px rgba(255, 246, 229, 0.16), 0 24px 48px rgba(0, 0, 0, 0.45);
                }
            }

            /* phone */
            @media (max-width: 699px) {
                .hero {
                    --s: min(calc(100vw / 540), 1.1px);
                }
                .stage {
                    flex-direction: column;
                    align-items: stretch;
                    gap: 22px;
                    min-height: 0;
                    padding: 16px 0 36px;
                }
                .stage::after,
                .snow {
                    display: none;
                }
                .photo {
                    position: relative;
                    inset: auto;
                    order: 1;
                    width: calc(100% - 32px);
                    height: auto;
                    aspect-ratio: 4 / 3;
                    margin: 0 auto;
                    border-radius: 18px;
                    object-position: 80% 30%;
                    box-shadow: 0 0 0 1px rgba(255, 246, 229, 0.16), 0 18px 36px rgba(0, 0, 0, 0.45);
                }
                .content {
                    order: 2;
                    padding: 0 24px;
                    text-shadow: none;
                    gap: 26px;
                }
                .unit {
                    align-self: center;
                    --pw: clamp(140px, 38vw, 190px);
                }
            }

            /* ---------- phone + tablet hero (<=1099px). Desktop (1100px and up) is untouched. ---------- */
            .m-bg,
            .m-branta,
            .bt-m {
                display: none;
            }
            @media (max-width: 1099px) {
                .stage {
                    --mpad: clamp(20px, 4.5vw, 48px);
                    display: flex;
                    flex-direction: column;
                    align-items: stretch;
                    min-height: max(calc(100svh - var(--bar)), 600px);
                    padding: 20px 0 28px;
                    gap: 0;
                    background-image: none;
                    isolation: isolate;
                }
                .photo {
                    display: none;
                }
                .m-bg {
                    display: block;
                    position: absolute;
                    inset: 0;
                    width: 100%;
                    height: 100%;
                    max-width: none;
                    object-fit: cover;
                    object-position: 50% 50%;
                    z-index: 0;
                    animation: bgfade 1.2s var(--ease) both;
                }
                .stage::after {
                    display: block;
                    background: linear-gradient(180deg, rgba(9, 21, 16, 0.35) 0%, rgba(9, 21, 16, 0) 45%, rgba(9, 21, 16, 0.3) 100%);
                }
                .m-branta {
                    display: block;
                    position: absolute;
                    top: -6px;
                    right: calc(var(--mpad) * -1);
                    width: min(53vw, 460px);
                    max-width: none;
                    height: auto;
                    z-index: 2;
                    -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent 100%);
                    mask-image: linear-gradient(to bottom, #000 78%, transparent 100%);
                    animation: rise 1s var(--ease) 0.4s both;
                }
                .content {
                    flex: 1 1 auto;
                    width: 100%;
                    box-sizing: border-box;
                    padding: 0 max(var(--mpad), env(safe-area-inset-right, 0px)) 0 max(var(--mpad), env(safe-area-inset-left, 0px));
                    align-self: auto;
                    align-items: stretch;
                    justify-content: center;
                    gap: 28px;
                    z-index: 3;
                    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.65);
                }
                .copy {
                    position: relative;
                }
                .ho,
                .no,
                .bubble {
                    font-family: "Mountains of Christmas", var(--display);
                }
                .ho {
                    font-style: normal;
                    font-weight: 700;
                    font-size: clamp(22px, 6.4vw, 54px);
                }
                .no {
                    font-weight: 700;
                    line-height: 1;
                }
                .n1 {
                    font-size: clamp(34px, 10.4vw, 82px);
                }
                .n2 {
                    font-size: clamp(46px, 14vw, 112px);
                }
                .n3 {
                    font-size: clamp(60px, 18vw, 146px);
                }
                .unit {
                    --pw: clamp(140px, 38vw, 250px);
                    width: fit-content;
                    max-width: 100%;
                    align-self: flex-start;
                    align-items: flex-start;
                    margin: 0;
                }
                .bubble {
                    left: calc(var(--pw) * 0.8);
                    width: max-content;
                    max-width: calc(100% - var(--pw) * 0.8);
                    box-sizing: border-box;
                    white-space: normal;
                    text-align: center;
                    border-radius: 22px;
                    font-size: clamp(15px, 4.2vw, 26px);
                    line-height: 1.1;
                }
                .bt-d {
                    display: none;
                }
                .bt-m {
                    display: inline;
                }
            }
            @media (min-width: 700px) and (max-width: 1099px) {
                .bubble {
                    max-width: calc(100vw - var(--mpad) * 2 - var(--pw) * 0.8);
                }
            }

            a.bubble {
                text-decoration: none;
            }

            /* ---------- desktop hero (1100px and up) ---------- */
            @media (min-width: 1100px) {
                .photo {
                    display: none;
                }
                .m-bg {
                    display: block;
                    position: absolute;
                    inset: 0;
                    width: 100%;
                    height: 100%;
                    max-width: none;
                    object-fit: cover;
                    object-position: 50% 50%;
                    z-index: 0;
                    animation: bgfade 1.4s var(--ease) both;
                }
                .m-branta {
                    display: block;
                    position: absolute;
                    right: clamp(12px, 2vw, 40px);
                    top: 50%;
                    transform: translateY(-50%);
                    height: 52%;
                    width: auto;
                    max-width: none;
                    z-index: 2;
                    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 9%, #000 80%, transparent 100%);
                    mask-image: linear-gradient(to bottom, transparent 0%, #000 9%, #000 80%, transparent 100%);
                    animation: rise 1.1s var(--ease) 0.3s both;
                }
                .ho {
                    font-size: max(32px, calc(var(--s) * 56));
                }
                .n1 {
                    font-size: max(42px, calc(var(--s) * 72));
                }
                .n2 {
                    font-size: max(60px, calc(var(--s) * 106));
                }
                .n3 {
                    font-size: max(82px, calc(var(--s) * 140));
                }
                .label {
                    font-size: clamp(13px, calc(var(--s) * 17), 19px);
                }
                .content {
                    position: static;
                    z-index: auto;
                }
                .copy {
                    position: static;
                }
                .santa,
                .branta,
                .unit {
                    position: relative;
                    z-index: 3;
                }
            }
            @media (min-width: 1100px) and (max-width: 1300px) {
                .m-branta {
                    height: auto;
                    width: 38vw;
                }
            }

            /* ---------- the speech bubble IS the button (all screen sizes) ---------- */
            .unit {
                flex-direction: row;
                align-items: flex-start;
                gap: 14px;
                width: fit-content;
                max-width: 100%;
                align-self: flex-start;
            }
            .unit .bubble {
                position: relative;
                left: auto;
                top: auto;
                margin-top: calc(var(--pw) * 0.2);
                display: flex;
                align-items: center;
                gap: 14px;
                box-sizing: border-box;
                width: auto;
                max-width: none;
                min-height: 54px;
                padding: 8px 8px 8px 22px;
                border-radius: 14px;
                background: linear-gradient(180deg, #cc3029, #b02922);
                color: var(--ink);
                font-family: var(--body);
                font-weight: 700;
                font-size: clamp(15px, calc(var(--s) * 19), 20px);
                line-height: 1.2;
                white-space: nowrap;
                text-align: left;
                text-decoration: none;
                box-shadow: inset 0 0 0 1px rgba(255, 246, 229, 0.18), 0 10px 24px rgba(0, 0, 0, 0.4);
                transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), filter 0.35s var(--ease);
            }
            .unit .bubble::after {
                left: -9px;
                top: calc(50% - 8px);
                width: 12px;
                height: 16px;
                background: #c42f29;
            }
            .unit .bubble:hover {
                transform: translateY(-2px);
                filter: brightness(1.08);
            }
            .unit .bubble .go {
                flex: none;
                align-self: stretch;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 44px;
                border-left: 1px solid rgba(255, 246, 229, 0.3);
            }
            @media (max-width: 1099px) {
                .unit .bubble {
                    white-space: normal;
                    min-height: 56px;
                    font-size: clamp(14px, 4vw, 20px);
                    padding-left: 18px;
                }
                .unit .bubble .go {
                    width: 38px;
                }
            }

            @keyframes rise {
                from {
                    opacity: 0;
                    translate: 0 22px;
                }
                to {
                    opacity: 1;
                    translate: 0 0;
                }
            }
            @keyframes bgfade {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }
            @keyframes pop {
                from {
                    opacity: 0;
                    scale: 0.6;
                }
                to {
                    opacity: 1;
                    scale: 1;
                }
            }
            @keyframes float {
                0%,
                100% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(-5px);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                html {
                    scroll-behavior: auto;
                }
                *,
                *::before,
                *::after {
                    animation: none !important;
                    transition: none !important;
                }
            }

            /* ---------- Branta video + speed controls ---------- */
            .m-branta {
                -webkit-mask-image: none !important;
                mask-image: none !important;
                animation: none !important;
                opacity: 0;
                animation: vfade 1.2s ease 0.2s forwards !important;
            }
            @keyframes vfade {
                to {
                    opacity: 1;
                }
            }
            .m-branta .bv {
                display: block;
                width: 100%;
                height: auto;
                aspect-ratio: 1986 / 1080;
                background: #000;
                pointer-events: none;
                -webkit-mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent), linear-gradient(to bottom, transparent, #000 8%, #000 92%, transparent);
                -webkit-mask-composite: source-in;
                mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent), linear-gradient(to bottom, transparent, #000 8%, #000 92%, transparent);
                mask-composite: intersect;
            }
            .spd {
                position: absolute;
                top: 100%;
                right: calc(var(--mpad, 0px) + 6px);
                margin-top: 4px;
                display: flex;
                gap: 2px;
                padding: 2px;
                border-radius: 999px;
                background: rgba(0, 0, 0, 0.45);
                border: 1px solid rgba(255, 255, 255, 0.14);
                backdrop-filter: blur(4px);
                -webkit-backdrop-filter: blur(4px);
                z-index: 4;
            }
            .spd button {
                font: inherit;
                font-size: 11px;
                line-height: 1;
                letter-spacing: 0.02em;
                color: rgba(255, 255, 255, 0.7);
                background: transparent;
                border: 0;
                border-radius: 999px;
                padding: 6px 9px;
                min-height: 28px;
                cursor: pointer;
                transition: background 0.2s, color 0.2s;
            }
            .spd button:hover {
                color: #fff;
            }
            .spd button[aria-pressed="true"] {
                background: rgba(255, 255, 255, 0.92);
                color: #111;
            }
            .spd button:focus-visible {
                outline: 2px solid var(--gold, #e8c15a);
                outline-offset: 1px;
            }
            @media (min-width: 1100px) {
                .m-branta {
                    height: auto;
                    width: min(40vw, 640px);
                }
            }
            @media (min-width: 1100px) and (max-width: 1300px) {
                .m-branta {
                    width: 38vw;
                }
            }
            @media (min-width: 1100px) {
                .spd {
                    right: 7%;
                }
            }
            @media (max-width: 1099px) {
                .spd button {
                    font-size: 10px;
                    padding: 6px 8px;
                }
            }

            /* collapsed speed control: shows current speed, opens on click */
            .spd {
                display: block;
                padding: 0;
                background: none;
                border: 0;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
            .spd-t {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                font: inherit;
                font-size: 11px;
                line-height: 1;
                color: rgba(255, 255, 255, 0.75);
                background: rgba(0, 0, 0, 0.45);
                border: 1px solid rgba(255, 255, 255, 0.14);
                border-radius: 999px;
                padding: 7px 10px;
                min-height: 28px;
                cursor: pointer;
                backdrop-filter: blur(4px);
                -webkit-backdrop-filter: blur(4px);
            }
            .spd-t:hover,
            .spd-t[aria-expanded="true"] {
                color: #fff;
            }
            .spd-t:focus-visible {
                outline: 2px solid var(--gold, #e8c15a);
