<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome to the Branti-establishment</title>
<meta name="description" content="Explore Generosity Ideas, join the Elf Brigade, or send your rants. Welcome to the Branti-establishment.">
<meta name="theme-color" content="#050d09">

<!-- Open Graph / social previews (WhatsApp, SMS, Facebook, X, LinkedIn, Telegram...).
     og:image and og:url MUST be absolute URLs. Use a 1200x630 JPG/PNG (under 5 MB). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Branta Claus">
<meta property="og:title" content="Welcome to the Branti-establishment">
<meta property="og:description" content="Explore Generosity Ideas, join the Elf Brigade, or send your rants.">
<meta property="og:image" content="https://brantaclaus.com/assets/card-og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Branta Claus welcomes you to the Branti-establishment">
<meta property="og:url" content="https://brantaclaus.com/card.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Welcome to the Branti-establishment">
<meta name="twitter:description" content="Explore Generosity Ideas, join the Elf Brigade, or send your rants.">
<meta name="twitter:image" content="https://brantaclaus.com/assets/card-og.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ============ CUSTOM ASSETS: edit these paths ============ */
  /* Font is loaded online from Google Fonts (see <link> in <head>). */
  :root {
    --bokeh: url("bg%20brante%20mobile.jpg");     /* PAGE background only: "bg brante mobile.jpg" */
    --pointer: "pointer.png";                      /* Branta pointer image (left side of card) */
    --card-ratio: 16 / 9;

    --ink: #fff8ec;
    --ink-soft: rgba(255, 248, 236, .86);
    --accent: #f0be55;
    --fallback: #07120d;

    --xred: #c8102e;      /* Christmas red */
    --xred-dark: #8f0a1f;
    --xgreen: #14532d;    /* Christmas green */
    --xgreen-light: #1f7a45;

    --heading: "Playfair Display", Georgia, "Times New Roman", serif; /* swap the name here to change font */
    --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  /* ENTIRE PAGE uses the bg image. Change .35 to 0 for no dimming. */
  body {
    font-family: var(--body);
    color: var(--ink);
    background:
      linear-gradient(rgba(3,8,6,.35), rgba(3,8,6,.35)),
      var(--bokeh) center / cover fixed no-repeat,
      var(--fallback);
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .stage { width: min(1000px, 100%); perspective: 1400px; }


  /* ===== PAGE-WIDE SPARKLES: twinkle gently, never follow the cursor ===== */
  body::before, body::after {
    content: "";
    position: fixed; inset: 0;
    z-index: 0;
    pointer-events: none;
    background-repeat: no-repeat;
    opacity: .25;
  }
  body::before {
    background-image:
      radial-gradient(3.5px 3.5px at 43% 21%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2px 2px at 11% 70%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2.5px 2.5px at 9% 66%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(2px 2px at 57% 55%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(2px 2px at 72% 56%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2px 2px at 17% 30%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2.5px 2.5px at 52% 8%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(3.5px 3.5px at 19% 39%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(3px 3px at 17% 75%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2px 2px at 89% 25%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3px 3px at 83% 26%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(2px 2px at 93% 10%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3.5px 3.5px at 65% 89%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3.5px 3.5px at 61% 76%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2.5px 2.5px at 33% 25%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(3.5px 3.5px at 40% 69%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3px 3px at 95% 59%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3.5px 3.5px at 11% 17%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(3.5px 3.5px at 45% 21%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3px 3px at 87% 11%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3.5px 3.5px at 46% 78%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2px 2px at 60% 10%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2px 2px at 62% 91%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(3.5px 3.5px at 91% 41%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(3px 3px at 51% 87%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(2.5px 2.5px at 61% 47%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2.5px 2.5px at 65% 9%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2.5px 2.5px at 18% 96%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2.5px 2.5px at 65% 12%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2.5px 2.5px at 72% 37%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3.5px 3.5px at 72% 37%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2.5px 2.5px at 89% 50%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(2.5px 2.5px at 24% 21%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2.5px 2.5px at 3% 64%, rgba(240,190,85,.95), transparent 70%);
    animation: twinkle 4.2s ease-in-out infinite;
  }
  body::after {
    background-image:
      radial-gradient(3.5px 3.5px at 2% 20%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3px 3px at 80% 74%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2px 2px at 90% 67%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3.5px 3.5px at 89% 73%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3.5px 3.5px at 52% 15%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2px 2px at 9% 26%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2px 2px at 58% 22%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2px 2px at 8% 15%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3px 3px at 70% 14%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3.5px 3.5px at 11% 28%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(3px 3px at 34% 46%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3.5px 3.5px at 16% 64%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2.5px 2.5px at 41% 12%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(3px 3px at 45% 96%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2px 2px at 90% 22%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(2.5px 2.5px at 69% 48%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3px 3px at 5% 69%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3px 3px at 13% 91%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2.5px 2.5px at 23% 47%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2.5px 2.5px at 66% 44%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3.5px 3.5px at 26% 32%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3.5px 3.5px at 31% 27%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3px 3px at 5% 5%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3px 3px at 26% 90%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3px 3px at 94% 46%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(3.5px 3.5px at 15% 31%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(2px 2px at 28% 63%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2px 2px at 85% 46%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2.5px 2.5px at 17% 51%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(3px 3px at 24% 57%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(3.5px 3.5px at 94% 52%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2.5px 2.5px at 12% 94%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(2.5px 2.5px at 18% 5%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2.5px 2.5px at 61% 85%, rgba(255,255,255,.9), transparent 70%);
    animation: twinkle 5.6s ease-in-out -2.4s infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .15; }
    50% { opacity: 1; }
  }
  .stage { position: relative; z-index: 1; }

  /* ===== SMOOTH LOAD ANIMATION ===== */
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(26px) scale(.97); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes artIn {
    from { opacity: 0; transform: translateX(-28px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }
  .card { animation: cardIn .9s cubic-bezier(.22,.8,.3,1) backwards; }
  .art img { opacity: 0; }
  .art img.loaded { animation: artIn 1s cubic-bezier(.22,.8,.3,1) .25s both; }
  .story > * { animation: rise .8s cubic-bezier(.22,.8,.3,1) both; }
  .story > :nth-child(1) { animation-delay: .35s; }
  .story > :nth-child(2) { animation-delay: .5s; }
  .story > :nth-child(3) { animation-delay: .65s; }
  .story > :nth-child(4) { animation-delay: .8s; }

  /* ============ CARD ============ */
  /* Card has NO background image, just a plain dark colour */
  .card {
    position: relative;
    width: 100%;
    aspect-ratio: var(--card-ratio);
    border-radius: 22px;
    overflow: hidden;
    isolation: isolate;
    background: linear-gradient(135deg, #0b1f15 0%, #07120d 100%);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,248,236,.14);
    transform-style: preserve-3d;
    transition: transform .25s ease, box-shadow .25s ease;
    will-change: transform;
  }


  /* STATIC snow + sparkles on the card background (does not move) */
  .card::before {
    content: "";
    position: absolute; inset: 0;
    z-index: 0;
    pointer-events: none;
    animation: twinkle 6s ease-in-out infinite;
    background-image:
      radial-gradient(2.5px 2.5px at 6% 12%, rgba(255,255,255,.95), transparent 70%),
      radial-gradient(1.5px 1.5px at 14% 34%, rgba(255,255,255,.8), transparent 70%),
      radial-gradient(3px 3px at 22% 8%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2px 2px at 30% 52%, rgba(255,255,255,.75), transparent 70%),
      radial-gradient(1.5px 1.5px at 38% 22%, rgba(255,255,255,.85), transparent 70%),
      radial-gradient(3px 3px at 46% 70%, rgba(255,255,255,.8), transparent 70%),
      radial-gradient(2px 2px at 54% 14%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2.5px 2.5px at 62% 88%, rgba(255,255,255,.85), transparent 70%),
      radial-gradient(1.5px 1.5px at 70% 40%, rgba(255,255,255,.8), transparent 70%),
      radial-gradient(3px 3px at 78% 12%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(2px 2px at 86% 60%, rgba(255,255,255,.8), transparent 70%),
      radial-gradient(2.5px 2.5px at 93% 28%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(1.5px 1.5px at 96% 82%, rgba(255,255,255,.75), transparent 70%),
      radial-gradient(2px 2px at 10% 76%, rgba(255,255,255,.8), transparent 70%),
      radial-gradient(2.5px 2.5px at 18% 92%, rgba(255,255,255,.85), transparent 70%),
      radial-gradient(1.5px 1.5px at 50% 46%, rgba(255,255,255,.7), transparent 70%),
      radial-gradient(2px 2px at 74% 74%, rgba(255,255,255,.8), transparent 70%),
      radial-gradient(2px 2px at 42% 94%, rgba(255,255,255,.75), transparent 70%),
      radial-gradient(3px 3px at 9% 55%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(3.5px 3.5px at 34% 38%, rgba(240,190,85,.9), transparent 70%),
      radial-gradient(3px 3px at 58% 30%, rgba(240,190,85,.9), transparent 70%),
      radial-gradient(3.5px 3.5px at 82% 44%, rgba(240,190,85,.95), transparent 70%),
      radial-gradient(3px 3px at 90% 8%, rgba(240,190,85,.9), transparent 70%),
      radial-gradient(3px 3px at 66% 62%, rgba(240,190,85,.85), transparent 70%);
  }
  .art, .story { z-index: 1; }

  .card.is-tilting { transition: transform .06s linear; box-shadow: 0 40px 70px -20px rgba(0,0,0,.9), 0 0 0 1px rgba(255,248,236,.2); }

  /* LEFT half: Branta Claus pointer artwork only, nothing overlaps it */
  .art {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 50%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-top: 4%;
    pointer-events: none;
  }
  .art img {
    height: 100%;
    width: auto;
    max-width: 100%;
    object-fit: contain;
    object-position: center bottom;
    filter: drop-shadow(0 12px 24px rgba(0,0,0,.55));
    /* the sleeve/elbow is cropped in the source image, so fade that edge softly */
    -webkit-mask-image: linear-gradient(to right, #000 0%, #000 80%, transparent 99%);
    mask-image: linear-gradient(to right, #000 0%, #000 80%, transparent 99%);
  }

  /* RIGHT half: welcome text */
  .story {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 50%;
    padding: clamp(18px, 4vw, 48px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: clamp(10px, 1.8vw, 20px);
  }

  .stamp {
    margin: 0;
    padding: .35em .9em;
    font-family: var(--body);
    font-weight: 600;
    font-size: clamp(.68rem, 1.2vw, .85rem);
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
  }

  .heading {
    margin: 0;
    font-family: var(--heading);
    font-weight: 700;
    font-size: clamp(1.8rem, 4.4vw, 3.3rem);
    line-height: 1.08;
    text-shadow: 0 2px 14px rgba(0,0,0,.75);
  }

  /* EDIT THE TEXT HERE */
  .blurb {
    margin: 0;
    max-width: 36ch;
    font-size: clamp(.9rem, 1.7vw, 1.2rem);
    line-height: 1.55;
    color: var(--ink-soft);
    text-shadow: 0 1px 8px rgba(0,0,0,.8);
  }
  .blurb b { font-weight: 600; color: var(--accent); }

  .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: clamp(2px, .8vw, 8px); }

  .cta, .share {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .55em;
    min-height: 48px;
    padding: .75em 1.4em;
    font-family: var(--body);
    font-weight: 600;
    font-size: clamp(.9rem, 1.4vw, 1.05rem);
    border-radius: 999px;
    text-decoration: none;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .cta {
    color: #1b1405;
    background: var(--accent);
    border: 1px solid transparent;
    box-shadow: 0 8px 20px -8px rgba(240,190,85,.65);
  }
  .cta:hover, .cta:focus-visible { background: #f8cf72; transform: translateY(-2px); outline: none; }

  /* Share button: frosted glass pill with a gold ring */
  .share {
    color: var(--ink);
    background: rgba(255,248,236,.1);
    border: 1px solid rgba(240,190,85,.7);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 8px 20px -10px rgba(0,0,0,.7);
  }
  .share svg { width: 1.2em; height: 1.2em; stroke: var(--accent); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .share:hover, .share:focus-visible { background: rgba(240,190,85,.18); border-color: var(--accent); transform: translateY(-2px); outline: none; }
  .cta:focus-visible, .share:focus-visible { box-shadow: 0 0 0 3px rgba(248,207,114,.55); }

  /* Share sheet fallback (desktop browsers without native share) */
  .sheet {
    position: fixed; inset: 0; display: none; place-items: center;
    background: rgba(0,0,0,.6); z-index: 20; padding: 16px;
  }
  .sheet.open { display: grid; }
  .sheet-box {
    width: min(380px, 100%);
    padding: 22px;
    border-radius: 20px;
    background: rgba(12,24,18,.96);
    border: 1px solid rgba(255,248,236,.16);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.9);
  }
  .sheet-box h2 { margin: 0 0 14px; font-family: var(--heading); font-weight: 700; font-size: 1.4rem; }
  .targets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .targets a, .targets button, .close {
    display: flex; align-items: center; justify-content: center;
    min-height: 46px; padding: 8px 12px;
    font: inherit; font-size: .95rem; color: var(--ink);
    background: rgba(255,248,236,.08);
    border: 1px solid rgba(255,248,236,.16);
    border-radius: 12px; text-decoration: none; cursor: pointer;
  }
  .targets a:hover, .targets button:hover, .close:hover { border-color: var(--accent); }
  .close { width: 100%; margin-top: 12px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    padding: 10px 18px; border-radius: 999px;
    background: #fff8ec; color: #1b1405; font-size: .9rem;
    opacity: 0; pointer-events: none; transition: .25s ease; z-index: 30;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ============ MOBILE: pointer image on top, text below ============ */
  @media (max-width: 720px) {
    body { align-items: start; padding: 16px 12px 32px; }
    .stage { perspective: none; }
    .card { aspect-ratio: auto; display: flex; flex-direction: column; border-radius: 18px; }
    .art {
      position: static; width: 100%;
      height: clamp(260px, 80vw, 440px);
      padding-top: 16px;
    }
    .art img { object-position: center bottom; }
    .story {
      position: static; width: 100%;
      padding: 20px 20px 26px;
      gap: 14px;
    }
    .heading { font-size: clamp(2rem, 9.5vw, 2.8rem); }
    .blurb { max-width: none; font-size: 1rem; }
    .buttons { width: 100%; }
    .cta { flex: 1 1 100%; }
    .share { flex: 1 1 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .cta, .share, .toast { transition: none; }
    body::before, body::after, .card::before { animation: none; opacity: .6; }
    .card, .art img.loaded, .story > * { animation: none; }
    .art img { opacity: 1; }
  }
</style>
</head>
<body>

<main class="stage">
  <article class="card" id="card" aria-label="Welcome to the Branti-establishment">
    <div class="art">
      <img id="pointerImg" src="pointer.png" alt="Branta Claus" onload="this.classList.add('loaded')" onerror="this.style.display='none'">
    </div>

    <section class="story">
      <p class="stamp">A Holiday Message</p>
      <h1 class="heading">Welcome to the Branti-establishment.</h1>
      <p class="blurb">
        Explore <b>Generosity Ideas</b>, join the <b>Elf Brigade</b>, or send your <b>rants</b>.
      </p>
      <div class="buttons">
        <a class="cta" href="index.html">Step Inside <span aria-hidden="true">→</span></a>
        <button class="share" id="shareBtn" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="m8.2 10.8 7.6-3.6M8.2 13.2l7.6 3.6"/></svg>
          Share
        </button>
      </div>
    </section>
  </article>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-box">
    <h2 id="sheetTitle">Share this card</h2>
    <div class="targets">
      <a id="shWa" target="_blank" rel="noopener">WhatsApp</a>
      <a id="shTg" target="_blank" rel="noopener">Telegram</a>
      <a id="shX" target="_blank" rel="noopener">X</a>
      <a id="shFb" target="_blank" rel="noopener">Facebook</a>
      <a id="shSms">SMS</a>
      <button id="shCopy" type="button">Copy link</button>
    </div>
    <button class="close" id="shClose" type="button">Close</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const SHARE = {
    title: "Welcome to the Branti-establishment",
    text: "Explore Generosity Ideas, join the Elf Brigade, or send your rants.",
    get url() { return location.href; }
  };

  const toast = (msg) => {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
  };
  const copyLink = async () => {
    try { await navigator.clipboard.writeText(SHARE.url); toast("Link copied"); }
    catch { toast("Copy the link from your address bar"); }
  };

  const sheet = document.getElementById("sheet");
  const openSheet = () => {
    const u = encodeURIComponent(SHARE.url), t = encodeURIComponent(SHARE.text);
    document.getElementById("shWa").href = `https://wa.me/?text=${t}%20${u}`;
    document.getElementById("shTg").href = `https://t.me/share/url?url=${u}&text=${t}`;
    document.getElementById("shX").href  = `https://twitter.com/intent/tweet?text=${t}&url=${u}`;
    document.getElementById("shFb").href = `https://www.facebook.com/sharer/sharer.php?u=${u}`;
    document.getElementById("shSms").href = `sms:?&body=${t}%20${u}`;
    sheet.classList.add("open");
  };
  const closeSheet = () => sheet.classList.remove("open");

  document.getElementById("shareBtn").addEventListener("click", async () => {
    if (navigator.share) {
      try { await navigator.share({ title: SHARE.title, text: SHARE.text, url: SHARE.url }); }
      catch (e) { if (e && e.name !== "AbortError") openSheet(); }
    } else { openSheet(); }
  });
  document.getElementById("shCopy").addEventListener("click", () => { copyLink(); closeSheet(); });
  document.getElementById("shClose").addEventListener("click", closeSheet);
  sheet.addEventListener("click", (e) => { if (e.target === sheet) closeSheet(); });
  addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });


  // Gentle 3D tilt: desktop mouse only, off for touch and reduced motion
  (() => {
    const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!fine || reduce) return;
    const card = document.getElementById("card");
    const MAX = 4;
    card.addEventListener("pointermove", (e) => {
      if (innerWidth <= 720) return;
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      card.classList.add("is-tilting");
      card.style.transform = `rotateY(${(x - .5) * MAX * 2}deg) rotateX(${(.5 - y) * MAX * 2}deg)`;
    });
    card.addEventListener("pointerleave", () => { card.classList.remove("is-tilting"); card.style.transform = ""; });
  })();
</script>
</body>
</html>
